<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI-CEL</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>🤖 AI-CEL</h1>
        <p>AI chat powered by your server-side Hugging Face token</p>
      </div>
      <span class="status">● Online</span>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <div class="message assistant">
        <div class="bubble">Hey! 👋 I'm AI-CEL. What would you like to ask?</div>
      </div>
    </section>

    <form id="chat-form" class="composer">
      <textarea id="prompt" rows="1" placeholder="Message AI-CEL..." autocomplete="off"></textarea>
      <button id="send" type="submit">➤</button>
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
