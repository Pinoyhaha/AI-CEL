<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI-CEL</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>🤖 AI-CEL</h1>
        <p id="mode-subtitle">Unfiltered Chat</p>
      </div>
      <div class="header-actions">
        <span class="status">● Online</span>
        <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Open model menu" aria-expanded="false">☰</button>
      </div>
    </header>

    <aside id="model-menu" class="model-menu" aria-hidden="true">
      <div class="menu-title">Choose AI mode</div>
      <button class="mode-option active" data-mode="Unfiltered Chat" type="button">🔥 <span><strong>Unfiltered Chat</strong><small>Open-ended chat</small></span></button>
      <button class="mode-option" data-mode="Coding AI" type="button">💻 <span><strong>Coding AI</strong><small>Code & debugging</small></span></button>
      <button class="mode-option" data-mode="Thinking AI" type="button">🧠 <span><strong>Thinking AI</strong><small>Deep reasoning</small></span></button>
      <button class="mode-option" data-mode="None" type="button">⚪ <span><strong>None</strong><small>Use normal chat only</small></span></button>
    </aside>

    <section id="messages" class="messages" aria-live="polite">
      <div class="message assistant">
        <div class="bubble">Hey! 👋 I'm AI-CEL. What would you like to ask?</div>
      </div>
    </section>

    <form id="chat-form" class="composer">
      <textarea id="prompt" rows="1" placeholder="Message AI-CEL..." autocomplete="off"></textarea>
      <button id="send" type="submit">➤</button>
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
