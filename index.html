<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090b10" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI-CEL" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <title>AI-CEL</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>🤖 AI-CEL</h1>
        <p id="mode-subtitle">🔥 Chatbot</p>
      </div>
      <div class="header-actions">
        <span class="status">● Online</span>
        <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Change AI model" aria-expanded="false">☰</button>
      </div>
    </header>

    <aside id="model-menu" class="model-menu" aria-hidden="true">
      <div class="menu-title">Change AI model</div>
      <div class="model-selector">
        <button class="mode-option active" data-mode="Unfiltered Chat" type="button"><span class="mode-icon">🔥</span><span><strong>Chatbot</strong><small>Unfiltered chat</small></span><span class="check">✓</span></button>
        <button class="mode-option" data-mode="Coding AI" type="button"><span class="mode-icon">💻</span><span><strong>Coding AI</strong><small>Code & debugging</small></span><span class="check">✓</span></button>
      </div>
    </aside>

    <section id="messages" class="messages" aria-live="polite">
      <div class="message assistant">
        <div class="bubble">Hey! 👋 I'm AI-CEL. Ask me anything, send me a file, or ask me to create one.</div>
      </div>
    </section>

    <form id="chat-form" class="composer">
      <input id="file-input" type="file" hidden />
      <button id="attach" class="attach-button" type="button" title="Attach a file" aria-label="Attach a file">📎</button>
      <div id="attachment-preview" class="attachment-preview" hidden></div>
      <textarea id="prompt" rows="1" placeholder="Message AI-CEL..." autocomplete="off"></textarea>
      <button id="send" type="submit">➤</button>
    </form>
  </main>
  <script src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
